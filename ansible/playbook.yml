---
- name: Prepare a dedicated Ubuntu AtlasOps host
  hosts: atlasops
  become: true
  gather_facts: true
  tasks:
    - name: Require Ubuntu 22.04 or 24.04 on amd64
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_version in ['22.04', '24.04']
          - ansible_facts.architecture == 'x86_64'
        fail_msg: "This playbook targets dedicated Ubuntu 22.04/24.04 amd64 VMs."
    - name: Install base packages
      ansible.builtin.apt:
        name: [ca-certificates, curl, git, make, python3, python3-venv, openssl]
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Create apt key directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
    - name: Fetch official Docker repository key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
    - name: Configure Docker repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.sources
        mode: '0644'
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: {{ ansible_facts.distribution_release }}
          Components: stable
          Architectures: amd64
          Signed-By: /etc/apt/keyrings/docker.asc
      register: docker_repo
    - name: Install Docker and Compose plugin
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
        state: present
        update_cache: "{{ docker_repo.changed }}"
    - name: Start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
    - name: Allow the dedicated SSH user to operate Docker
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
    - name: Explain session refresh
      ansible.builtin.debug:
        msg: "Reconnect SSH before running Docker. Docker group membership is root-equivalent."
