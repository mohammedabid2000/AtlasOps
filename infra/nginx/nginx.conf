user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  log_format json escape=json '{"timestamp":"$time_iso8601","service":"nginx","request_id":"$request_id","method":"$request_method","route":"$uri","status":$status,"duration_seconds":$request_time}';
  access_log /logs/nginx/access.jsonl json;
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  limit_req_status 429;
  client_max_body_size 16k;
  client_body_timeout 10s;
  keepalive_timeout 30s;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8080;
    server_name localhost;
    return 308 https://$host:8443$request_uri;
  }
  server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location ~* ^/metrics(?:/|$) { return 404; }
    location / {
      limit_req zone=api burst=30 nodelay;
      set $waf http://waf:8080;
      proxy_pass $waf;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;
    }
  }
}
