input {
  file {
    path => ["/logs/app/api.jsonl", "/logs/app/api.jsonl.[1-3]", "/logs/nginx/access.jsonl", "/logs/nginx/access.jsonl.1"]
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/atlasops.sincedb"
    codec => json
  }
}
filter {
  if [timestamp] {
    date { match => ["timestamp", "ISO8601"] }
  }
  mutate {
    remove_field => ["timestamp", "host", "path", "@version"]
  }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "atlasops-%{+YYYY.MM.dd}"
    ilm_enabled => false
    manage_template => false
  }
}
